[project]
name = "uaf"
version = "1.0.1"
description = "Real-time wireless AP scanner with active reconnaissance for Linux"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
readme = "README.md"
authors = [
    {name = "devastator-x"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/devastator-x/uaf"
Repository = "https://github.com/devastator-x/uaf"
Issues = "https://github.com/devastator-x/uaf/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
uaf = "ap_scanner.__main__:main"

[build-system]
requires = ["setuptools>=68.0,<75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ap_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
